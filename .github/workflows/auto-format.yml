# Auto-format / PR housekeeping job (Issue #33).
#
# Runs on pull requests targeting Develop. Applies `cargo fmt --all` and
# refreshes `Cargo.lock` against the checked-out NEAT-AI-core path dependency
# (`cargo update -p neat-core`) so workers stop reprinting
# `Updating neat-core vX -> vY` after every fetch. If the working tree
# changes, the fix is committed and pushed back. Re-running on a clean
# branch is a no-op, so the job is safe/idempotent.
#
# Deliberately does NOT bump `neat-core.expected-version` — the breaking-bump
# gate stays a human acknowledgement.
#
# Pattern aligned with NEAT-AI-scorer auto-format (Issues #19 / #542 there).
name: Auto Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Milestone sub-issue PRs target a shared `milestone/<slug>` branch and
      # merge without ever touching Develop, so without this glob they skip
      # auto-format entirely (Issue #168). `**` matches nested names too.
      - "milestone/**"
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-format:
    name: Auto-format Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip forks — neither GITHUB_TOKEN nor ACTIONS_PUSH can push to a
    # fork's branch. Formatting on fork PRs is the author's responsibility.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      # The `secrets` context is unavailable in a step-level `if:`, so the
      # push App's configured/not-configured state is hoisted to a job-level
      # env flag. Until an organisation admin creates the App and stores its
      # secrets this is 'false': the mint step is skipped and the push falls
      # back to ACTIONS_PUSH / GITHUB_TOKEN.
      PUSH_APP_CONFIGURED: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID != '' && secrets.ACTIONS_PUSH_APP_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Keep the job token off disk; push auth is injected only below.
          persist-credentials: false

      - name: Set up NEAT-AI-core sibling (path dependency for neat-core)
        uses: ./.github/actions/setup-neat-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18
        with:
          components: rustfmt

      - name: Apply cargo fmt
        run: |
          set -euo pipefail
          cargo fmt --all

      # Refresh Cargo.lock against the sibling neat-core path dependency.
      # Scoped to `-p neat-core` so crates.io bumps stay out of this job —
      # only the path-dep version (and the workspace member version Cargo
      # rewrites alongside it) moves.
      - name: Sync Cargo.lock to latest neat-core
        run: |
          set -euo pipefail
          cargo update -p neat-core

      # Resolve the commit message here, not in the push step below: the
      # helper is PR-head code, so running it alongside $GH_PAT would hand
      # the org PAT straight to an attacker-editable script.
      - name: Detect formatting / lockfile changes
        id: detect
        run: |
          set -euo pipefail
          if ./scripts/auto-format.sh --check-changes; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi
          {
            echo "commit_message<<AUTO_FORMAT_COMMIT_MESSAGE_EOF"
            ./scripts/auto-format.sh --commit-message
            echo "AUTO_FORMAT_COMMIT_MESSAGE_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Mint repo-scoped push token
        id: push-token
        if: steps.detect.outputs.changed == 'true' && env.PUSH_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACTIONS_PUSH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Push with the minted repo-scoped token, falling back to the org-level
      # ACTIONS_PUSH PAT (then GITHUB_TOKEN). git and base64 are pinned to
      # absolute paths; every git invocation disables repository hooks; no
      # repository script runs in this step (PAT hardening).
      - name: Commit and push rustfmt / lock sync fixes
        if: steps.detect.outputs.changed == 'true'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          COMMIT_MESSAGE: ${{ steps.detect.outputs.commit_message }}
          GH_PAT: ${{ steps.push-token.outputs.token || secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GIT=/usr/bin/git
          BASE64=/usr/bin/base64
          "$GIT" -c core.hooksPath=/dev/null config user.name "github-actions[bot]"
          "$GIT" -c core.hooksPath=/dev/null config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$GIT" -c core.hooksPath=/dev/null commit -am "$COMMIT_MESSAGE"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | "$BASE64" -w0)"
          "$GIT" -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            push origin "HEAD:$PR_HEAD_REF"
