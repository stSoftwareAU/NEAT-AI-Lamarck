# Auto-format / PR housekeeping job (Issue #33).
#
# Runs on pull requests targeting Develop. Applies `cargo fmt --all`; if the
# working tree changes, the fix is committed and pushed back. Re-running on a
# clean branch is a no-op, so the job is safe/idempotent.
#
# Deliberately does NOT touch the `neat-core` pin. Since Issue #235 the
# dependency is a git-tag pin on a core release, and `family-sync.yml` — via
# the canonical `scripts/family-pins.sh` — is the one job that moves it, so the
# move always arrives with the `Cargo.lock` change `version-increment.yml`
# gates on. A second job moving the same pin would race it.
#
# Pattern aligned with NEAT-AI-scorer auto-format (Issues #19 / #542 there).
name: Auto Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Milestone sub-issue PRs target a shared `milestone/<slug>` branch and
      # merge without ever touching Develop, so without this glob they skip
      # auto-format entirely (Issue #168). `**` matches nested names too.
      - "milestone/**"
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-format:
    name: Auto-format Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip forks — neither GITHUB_TOKEN nor ACTIONS_PUSH can push to a
    # fork's branch. Formatting on fork PRs is the author's responsibility.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Keep the job token off disk; push auth is injected only below.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18
        with:
          components: rustfmt

      - name: Apply cargo fmt
        run: |
          set -euo pipefail
          cargo fmt --all

      # Resolve the commit message here, not in the push step below: the
      # helper is PR-head code, so running it alongside the push token would
      # hand the org PAT straight to an attacker-editable script.
      - name: Detect formatting / lockfile changes
        id: detect
        run: |
          set -euo pipefail
          if ./scripts/auto-format.sh --check-changes; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi
          {
            echo "commit_message<<AUTO_FORMAT_COMMIT_MESSAGE_EOF"
            ./scripts/auto-format.sh --commit-message
            echo "AUTO_FORMAT_COMMIT_MESSAGE_EOF"
          } >>"$GITHUB_OUTPUT"

      # Commit and push through the shared bot-push action (Issue #252): the
      # App token -> ACTIONS_PUSH -> GITHUB_TOKEN chain and the push hardening
      # live there, once, for every bot job. No repository script runs in it.
      - name: Commit and push rustfmt / lock sync fixes
        if: steps.detect.outputs.changed == 'true'
        uses: ./.github/actions/bot-push
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          commit-message: ${{ steps.detect.outputs.commit_message }}
          app-client-id: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.ACTIONS_PUSH_APP_PRIVATE_KEY }}
          push-pat: ${{ secrets.ACTIONS_PUSH }}
