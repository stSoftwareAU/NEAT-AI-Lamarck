# Keep scripts/runlib.sh byte-identical to NEAT-AI-core's canonical copy
# (Issue #234, NEAT-AI-core#680).
#
# `scripts/runlib.sh` has one home — `scripts/runlib.sh` on NEAT-AI-core
# `Develop`. Every Rust sibling carries a byte-for-byte copy; behaviour changes
# are made in core and copied outward, never edited downstream. This job is the
# copying: on every PR it fetches core's Develop copy, and when the committed
# file differs it rewrites, commits and pushes it onto the PR branch. A stale
# copy is therefore refreshed before review rather than drifting silently.
#
# There is no `paths:` filter on purpose. Drift arrives when *core* changes,
# not when this PR touches scripts/, so gating on the PR's own paths would let
# a stale copy through every PR that happens not to touch that directory.
#
# A fetch error fails the job. A swallowed fetch would leave the stale copy in
# place and report success — the exact "absence of a failure is not success"
# shape this repository refuses.
#
# Push auth matches version-increment.yml (App token -> ACTIONS_PUSH ->
# GITHUB_TOKEN). `version-increment.yml` is paths-filtered to `lamarck/src/**`,
# `lamarck/Cargo.toml` and `Cargo.lock`, so a runlib refresh does not bump the
# crate version.
name: Family Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Milestone sub-issue PRs merge into `milestone/<slug>` and never touch
      # Develop, so without this glob they would carry a stale runlib.sh all
      # the way into the milestone branch. `**` matches nested names too.
      - "milestone/**"

permissions:
  contents: read

concurrency:
  group: family-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  family-sync:
    name: Sync canonical runlib.sh from NEAT-AI-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A fork's PR branch cannot be pushed to, and the token is not shared with
    # forks, so the job would fail rather than sync.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    env:
      PUSH_APP_CONFIGURED: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID != '' && secrets.ACTIONS_PUSH_APP_PRIVATE_KEY != '' }}
      CANONICAL_REPO: stSoftwareAU/NEAT-AI-core
      CANONICAL_REF: Develop
      CANONICAL_PATH: scripts/runlib.sh

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Fail loud on a fetch error: a stale runlib.sh that silently passed as
      # "in sync" is worse than a red job, because every sibling then drifts.
      - name: Fetch the canonical runlib.sh from NEAT-AI-core
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/canonical-runlib.sh"
          if ! gh api \
            -H "Accept: application/vnd.github.raw" \
            "repos/${CANONICAL_REPO}/contents/${CANONICAL_PATH}?ref=${CANONICAL_REF}" \
            >"$dest"; then
            echo "::error::could not fetch ${CANONICAL_PATH} from ${CANONICAL_REPO}@${CANONICAL_REF}"
            exit 1
          fi
          # An empty file is a failed fetch wearing a success exit code.
          if [ ! -s "$dest" ]; then
            echo "::error::fetched ${CANONICAL_PATH} from ${CANONICAL_REPO}@${CANONICAL_REF} but it is empty"
            exit 1
          fi
          echo "canonical=${dest}" >>"$GITHUB_OUTPUT"

      - name: Refresh scripts/runlib.sh when it differs
        id: compare
        env:
          CANONICAL_FILE: ${{ steps.fetch.outputs.canonical }}
        run: |
          set -euo pipefail
          if cmp -s "$CANONICAL_FILE" "$CANONICAL_PATH"; then
            echo "OK   ${CANONICAL_PATH} is byte-identical to ${CANONICAL_REPO}@${CANONICAL_REF}"
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::${CANONICAL_PATH} differs from ${CANONICAL_REPO}@${CANONICAL_REF} — refreshing it"
          diff -u "$CANONICAL_PATH" "$CANONICAL_FILE" || true
          cp "$CANONICAL_FILE" "$CANONICAL_PATH"
          chmod +x "$CANONICAL_PATH"
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Mint repo-scoped push token
        id: push-token
        if: steps.compare.outputs.changed == 'true' && env.PUSH_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACTIONS_PUSH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit and push the refreshed runlib.sh
        if: steps.compare.outputs.changed == 'true'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_PAT: ${{ steps.push-token.outputs.token || secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GIT=/usr/bin/git
          BASE64=/usr/bin/base64
          "$GIT" -c core.hooksPath=/dev/null config user.name "github-actions[bot]"
          "$GIT" -c core.hooksPath=/dev/null config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$GIT" -c core.hooksPath=/dev/null add "$CANONICAL_PATH"
          "$GIT" -c core.hooksPath=/dev/null commit -m "chore: sync scripts/runlib.sh from NEAT-AI-core Develop"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | "$BASE64" -w0)"
          if ! git ls-remote --exit-code --heads origin "$PR_HEAD_REF" >/dev/null 2>&1; then
            echo "::notice::Head branch '$PR_HEAD_REF' no longer exists; skipping push."
            exit 0
          fi
          # Rebase onto whatever landed while this job ran — version-increment
          # pushes to the same branch — so a concurrent commit is not clobbered
          # and the push needs no force.
          "$GIT" -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            fetch --no-tags origin "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}"
          "$GIT" -c core.hooksPath=/dev/null rebase "refs/remotes/origin/${PR_HEAD_REF}"
          "$GIT" -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            push origin "HEAD:$PR_HEAD_REF"
