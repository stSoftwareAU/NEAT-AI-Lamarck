# Auto-increment lamarck/Cargo.toml patch when what the crate builds from
# changes on a PR — its sources, its manifest or the resolved dependency set in
# Cargo.lock (GRQ-taxation version-increment / runlib.sh contract).
#
# Remotes rebuild neat_ai_lamarck when the crate version changes. This job
# bumps the patch on PRs that touch any of those inputs if the branch is equal
# to its base branch (not already ahead). The lockfile counts because
# family-sync.yml moves the `neat-core` release pin (Issue #235): that move
# touches only the manifest and the lockfile, and shipping it under an
# unchanged version would leave remotes on a stale binary. A version *behind* the base fails the job
# (Issue #152) — that is a downgrade, not an intentional bump. Re-running
# after a successful bump is a no-op (idempotent).
#
# The comparison base is the branch the PR actually targets (Issue #190):
# milestone sub-issue PRs merge into `milestone/<slug>` and never touch
# Develop, so a hardcoded `origin/Develop` both skipped them (branch filter)
# and, once the milestone branch carried one bump, read "already ahead of
# base" for every later sub-issue PR.
#
# Pushes through the shared `.github/actions/bot-push` action (Issue #252):
# App token → ACTIONS_PUSH → GITHUB_TOKEN, rebased onto concurrent bot pushes.
name: Version Increment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Milestone sub-issue PRs target a shared `milestone/<slug>` branch and
      # merge without ever touching Develop, so without this glob they ship
      # source changes under an unchanged crate version (Issue #190).
      # `**` matches nested names too.
      - "milestone/**"
    paths:
      - "lamarck/src/**"
      - "lamarck/Cargo.toml"
      - "Cargo.lock"
      - "scripts/bump-lamarck-version.sh"
      - ".github/workflows/version-increment.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version-increment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-increment:
    name: Auto-increment Versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Fail loud when the base branch cannot be resolved: a swallowed fetch
      # would leave the bump comparing against nothing and look like a pass.
      - name: Fetch base branch
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/remotes/origin/${PR_BASE_REF}" >/dev/null; then
            echo "OK   origin/${PR_BASE_REF} already fetched"
            exit 0
          fi
          git fetch --no-tags origin \
            "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"

      - name: Bump lamarck patch version when src changed
        id: bump
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if ./scripts/bump-lamarck-version.sh --base-ref "origin/${PR_BASE_REF}"; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              echo "changed=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$status"
          fi

      # Push auth and hardening live in the shared bot-push action (Issue #252).
      - name: Commit and push version bump
        if: steps.bump.outputs.changed == 'true'
        uses: ./.github/actions/bot-push
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          commit-message: "chore: auto-increment versions for changed projects"
          add-paths: lamarck/Cargo.toml Cargo.lock
          app-client-id: ${{ secrets.ACTIONS_PUSH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.ACTIONS_PUSH_APP_PRIVATE_KEY }}
          push-pat: ${{ secrets.ACTIONS_PUSH }}
