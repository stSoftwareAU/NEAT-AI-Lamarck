[workspace]
members = ["lamarck"]
resolver = "2"

# Dev builds: compile as fast as possible (VibeCoding#4159 / Issue #153).
# line-tables-only keeps panic file:line without full DWARF; opt-level and
# incremental stay at Cargo defaults (0 / on).
[profile.dev]
debug = "line-tables-only"

# Release builds: most optimised artefact; compile time is irrelevant.
# Workspace-wide — not scoped via [profile.release.package.<name>].
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused = "deny"

[workspace.lints.clippy]
collapsible_if = "deny"
filter_next = "deny"
