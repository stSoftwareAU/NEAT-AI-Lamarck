[package]
name = "neat_ai_lamarck"
version = "0.1.39"
edition = "2024"
license = "Apache-2.0"
description = "Experimental Lamarck-style optimiser for already-fit NEAT-AI creatures."
repository = "https://github.com/stSoftwareAU/NEAT-AI-Lamarck"
readme = "../README.md"

[lints]
workspace = true

[lib]
name = "neat_ai_lamarck"
path = "src/lib.rs"

# No explicit `[[bin]]` table: cargo already auto-discovers `src/main.rs` as a
# bin target named after the package, so such a table would restate the default
# exactly. The canonical `scripts/runlib.sh` reads one `[[bin]]` table that
# names the crate without running cargo (NEAT-AI-core#690), so the table is
# not costly any more — it is simply redundant. `scripts/test-runlib.sh` runs
# the already-installed case against this manifest, so a shape the script
# cannot read without `cargo metadata` fails there (Issue #234).

[dependencies]
# neat-core is consumed as a released git tag, never as a sibling path: the pin
# moves only through this repository's own PR, where `scripts/family-pins.sh`
# refreshes it to core's latest release and CI judges the result (Issue #235).
# Keep it on one line — that is the form family-pins.sh rewrites.
neat-core = { git = "https://github.com/stSoftwareAU/NEAT-AI-core", tag = "v0.22.5" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"

# Graceful SIGINT/SIGTERM cancellation (issue #72). Unix-only crate; the
# handler is installed behind `cfg(unix)`.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
