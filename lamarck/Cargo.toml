[package]
name = "neat_ai_lamarck"
version = "0.1.37"
edition = "2024"
license = "Apache-2.0"
description = "Experimental Lamarck-style optimiser for already-fit NEAT-AI creatures."
repository = "https://github.com/stSoftwareAU/NEAT-AI-Lamarck"
readme = "../README.md"

[lints]
workspace = true

[lib]
name = "neat_ai_lamarck"
path = "src/lib.rs"

# No explicit `[[bin]]` table: cargo already auto-discovers `src/main.rs` as a
# bin target named after the package, so such a table would restate the default
# exactly. Spelling it out costs real work — the canonical
# `scripts/runlib.sh` treats an explicit `[[bin]]` as a shape it cannot read
# without cargo, so it falls back to `cargo metadata` on *every* invocation
# instead of taking its no-cargo already-installed fast path (Issue #234).

[dependencies]
# Keep this sibling path aligned with NEAT-AI-scorer until/unless workspace
# orchestration changes. CI will need to check out NEAT-AI-core beside this repo.
neat-core = { path = "../../NEAT-AI-core/neat-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

# Graceful SIGINT/SIGTERM cancellation (issue #72). Unix-only crate; the
# handler is installed behind `cfg(unix)`.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
